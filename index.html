<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Tomb of Galen: An Uncharted Medical Quest</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Georgia', 'Times New Roman', serif;
        }

        body {
            background-color: #0d0f12;
            color: #e0d8c3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .game-container {
            max-width: 750px;
            width: 100%;
            background: #181c22;
            border: 2px solid #8c6d3f;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: linear-gradient(180deg, #2a2015 0%, #181c22 100%);
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #8c6d3f;
        }

        .header h1 {
            color: #d4af37;
            font-size: 1.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 2px 2px 4px #000;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: #111418;
            padding: 10px;
            border-bottom: 1px solid #332a1e;
            font-size: 0.9rem;
            color: #a89f91;
        }

        .stat-val {
            color: #d4af37;
            font-weight: bold;
        }

        .story-section {
            padding: 25px;
            line-height: 1.6;
            font-size: 1.05rem;
            min-height: 160px;
            background: #14171c;
        }

        .story-text {
            margin-bottom: 15px;
        }

        .options-container {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #181c22;
        }

        .btn-option {
            background: #252a33;
            color: #d8cfbe;
            border: 1px solid #57462c;
            padding: 14px 18px;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .btn-option:hover {
            background: #3b3123;
            border-color: #d4af37;
            color: #fff;
            transform: translateX(4px);
        }

        .feedback-banner {
            padding: 12px 20px;
            font-weight: bold;
            display: none;
            text-align: center;
        }

        .feedback-correct {
            background: #1c3b22;
            color: #62d978;
            border-top: 1px solid #2e663a;
        }

        .feedback-wrong {
            background: #3b1c1c;
            color: #d96262;
            border-top: 1px solid #662e2e;
        }

        .restart-btn {
            display: none;
            margin: 20px auto;
            padding: 12px 24px;
            background: #d4af37;
            color: #000;
            border: none;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
        }

        .restart-btn:hover {
            background: #f0c946;
        }
    </style>
</head>
<body>

<div class="game-container">
    <div class="header">
        <h1>Tomb of Galen</h1>
    </div>

    <div class="stats-bar">
        <div>Explorer: <span class="stat-val" id="player-name">Dr. Drake</span></div>
        <div>Health: <span class="stat-val" id="health-val">100 HP</span></div>
        <div>Relics Found: <span class="stat-val" id="relics-val">0</span></div>
    </div>

    <div class="story-section">
        <div class="story-text" id="story-text">
            Loading expedition...
        </div>
    </div>

    <div class="feedback-banner" id="feedback"></div>

    <div class="options-container" id="options-container">
        <!-- Dynamic options will appear here -->
    </div>

    <button class="restart-btn" id="restart-btn" onclick="restartGame()">Try Quest Again</button>
</div>

<script>
    // Game State Variables
    let health = 100;
    let relics = 0;
    let currentStep = 0;

    // Quest Decision Tree & Quiz Data
    const storyData = [
        {
            id: 0,
            story: "You light your torch inside the damp, ancient anatomical chamber. Embedded in the stone door ahead is a carved riddle left behind by ancient physicians: 'To unlock the passage without triggering the collapsing ceiling, identify which cranial nerve provides parasympathetic innervation to the heart, lungs, and digestive tract.'",
            options: [
                { text: "A. Cranial Nerve V (Trigeminal)", correct: false, feedback: "Wrong door mechanism! Traps activate—spikes graze your arm. (-25 HP)" },
                { text: "B. Cranial Nerve X (Vagus Nerve)", correct: true, feedback: "Correct! Heavy gears turn, and the ancient stone gate slides open smoothly." },
                { text: "C. Cranial Nerve VII (Facial)", correct: false, feedback: "Incorrect. Dust rains down as a tripwire triggers. (-25 HP)" }
            ]
        },
        {
            id: 1,
            story: "Passing into the Inner Sanctum, you find an ancient altar with two pedestals holding glowing flasks. An inscription warns: 'A traveler suffers severe hypotension, bradycardia, and warm dry skin following a traumatic high cervical spinal cord injury. Choose the antidote reflecting the underlying shock mechanism.'",
            options: [
                { text: "A. Administer Atropine & Vasopressors (Neurogenic Shock)", correct: true, feedback: "Spot on! The pedestal unlocks and you retrieve an ancient Golden Caduceus relic! (+1 Relic)" },
                { text: "B. Administer Massive Fluid Bolus only (Hypovolemic Shock)", correct: false, feedback: "Incorrect diagnosis! The altar vents poisonous mist. (-25 HP)" },
                { text: "C. Administer Epinephrine for Anaphylaxis", correct: false, feedback: "Wrong mechanism! A dart hits your shoulder. (-25 HP)" }
            ]
        },
        {
            id: 2,
            story: "You reach the treasure vault's final door guarded by two bronze statues. The door asks for the core hallmark of Parkinson's Disease in neuro-pathology: 'Which anatomical structure undergoes progressive loss of dopaminergic neurons?'",
            options: [
                { text: "A. Hippocampus", correct: false, feedback: "Incorrect. The floor beneath you tilts dangerously! (-25 HP)" },
                { text: "B. Substantia Nigra pars compacta", correct: true, feedback: "A golden glow illuminates the chamber as the final treasure vault opens!" },
                { text: "C. Cerebellar Cortex", correct: false, feedback: "Wrong! A pendulum blade swings from the ceiling. (-25 HP)" }
            ]
        }
    ];

    function loadStep(stepIndex) {
        document.getElementById('feedback').style.display = 'none';
        
        if (health <= 0) {
            endGame(false);
            return;
        }

        if (stepIndex >= storyData.length) {
            endGame(true);
            return;
        }

        const step = storyData[stepIndex];
        document.getElementById('story-text').innerText = step.story;
        
        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';

        step.options.forEach(option => {
            const btn = document.createElement('button');
            btn.className = 'btn-option';
            btn.innerText = option.text;
            btn.onclick = () => handleChoice(option, stepIndex);
            optionsContainer.appendChild(btn);
        });
    }

    function handleChoice(option, stepIndex) {
        const feedbackEl = document.getElementById('feedback');
        feedbackEl.style.display = 'block';
        feedbackEl.innerText = option.feedback;

        if (option.correct) {
            feedbackEl.className = 'feedback-banner feedback-correct';
            if(stepIndex === 1) relics++; // Award relic on step 1
        } else {
            feedbackEl.className = 'feedback-banner feedback-wrong';
            health -= 25;
        }

        updateUI();

        // Disable buttons briefly to let player read feedback
        const buttons = document.querySelectorAll('.btn-option');
        buttons.forEach(b => b.disabled = true);

        setTimeout(() => {
            currentStep++;
            loadStep(currentStep);
        }, 2200);
    }

    function updateUI() {
        document.getElementById('health-val').innerText = health + ' HP';
        document.getElementById('relics-val').innerText = relics;
    }

    function endGame(victory) {
        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';

        if (victory) {
            document.getElementById('story-text').innerHTML = `<strong>EXPEDITION SUCCESSFUL!</strong><br><br>You escaped the Tomb of Galen with <strong>${relics} Golden Relic(s)</strong> and <strong>${health} HP</strong> remaining! You have proven your mastery of medical knowledge under high-stakes conditions.`;
        } else {
            document.getElementById('story-text').innerHTML = `<strong>EXPEDITION FAILED!</strong><br><br>Your health reached 0. The ancient traps defeated you this time. Rest up, review your anatomical facts, and try the quest again!`;
        }

        document.getElementById('restart-btn').style.display = 'block';
    }

    function restartGame() {
        health = 100;
        relics = 0;
        currentStep = 0;
        document.getElementById('restart-btn').style.display = 'none';
        updateUI();
        loadStep(0);
    }

    // Start game on load
    loadStep(0);
</script>

</body>
</html>

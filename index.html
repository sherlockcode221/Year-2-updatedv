<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uncharted Expeditions: The Temple of Galen</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: #080a0c;
            color: #e0d8c3;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-wrapper {
            position: relative;
            box-shadow: 0 0 30px rgba(0,0,0,0.9);
            border: 3px solid #8c6d3f;
            border-radius: 8px;
            overflow: hidden;
        }

        canvas { background-color: #12151b; display: block; }

        /* HUD Overlay */
        .hud {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
        }

        .hud-card {
            background: rgba(16, 20, 26, 0.85);
            padding: 8px 16px;
            border-radius: 6px;
            border: 1px solid #57462c;
        }

        .health-bar-container {
            width: 160px;
            height: 14px;
            background: #2a1515;
            border: 1px solid #702828;
            border-radius: 7px;
            overflow: hidden;
            margin-top: 4px;
        }

        .health-bar-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #d93636, #ff6b6b);
            transition: width 0.2s ease;
        }

        /* Quiz Overlay Modal */
        #quiz-modal {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(8, 10, 12, 0.92);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            text-align: center;
            z-index: 10;
        }

        .quiz-box {
            max-width: 580px;
            background: #181c24;
            border: 2px solid #d4af37;
            border-radius: 10px;
            padding: 24px;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
        }

        .quiz-title { color: #d4af37; font-size: 1.2rem; margin-bottom: 12px; text-transform: uppercase; }
        .quiz-text { font-size: 1.05rem; margin-bottom: 20px; line-height: 1.5; color: #ece5d8; }

        .btn-grid { display: flex; flex-direction: column; gap: 10px; }
        .quiz-btn {
            background: #252b36;
            color: #e0d8c3;
            border: 1px solid #57462c;
            padding: 12px 16px;
            border-radius: 6px;
            font-size: 0.95rem;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
        }

        .quiz-btn:hover { background: #3d3324; border-color: #d4af37; color: #fff; }

        .controls-hint {
            margin-top: 12px;
            font-size: 0.85rem;
            color: #8c8375;
        }
    </style>
</head>
<body>

<div id="game-wrapper">
    <canvas id="gameCanvas" width="800" height="500"></canvas>

    <!-- Real-Time HUD -->
    <div class="hud">
        <div class="hud-card">
            <div>EXPLORER DRAKE</div>
            <div class="health-bar-container">
                <div class="health-bar-fill" id="hp-bar"></div>
            </div>
        </div>
        <div class="hud-card">
            RELICS: <span id="relic-count" style="color:#d4af37;">0/3</span>
        </div>
    </div>

    <!-- Interactive Medical Puzzle Modal -->
    <div id="quiz-modal">
        <div class="quiz-box">
            <div class="quiz-title">Ancient Altar Riddle</div>
            <div class="quiz-text" id="quiz-question">Question text goes here...</div>
            <div class="btn-grid" id="quiz-options"></div>
        </div>
    </div>
</div>

<div class="controls-hint">
    [W, A, S, D] Move Explorer | [SPACEBAR] Attack Guardians | Walk to Glowing Altars to Solve Medical Riddles
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Key Listener State
    const keys = {};
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    // Game Variables
    let isPaused = false;
    let relicsFound = 0;
    let attackCooldown = 0;
    let attackActive = false;

    // Player Object
    const player = {
        x: 80, y: 230, size: 24, speed: 3.2, hp: 100, maxHp: 100,
        facing: 'right'
    };

    // Enemies (Guardians)
    const enemies = [
        { x: 300, y: 150, size: 22, hp: 30, maxHp: 30, vx: 1.5, vy: 1, color: '#aa3838' },
        { x: 550, y: 320, size: 22, hp: 30, maxHp: 30, vx: -1, vy: 1.5, color: '#aa3838' }
    ];

    // Glowing Medical Altars
    const altars = [
        {
            x: 240, y: 100, size: 30, active: true,
            q: "To unlock the chamber, identify which cranial nerve carries parasympathetic signals to the heart & gastrointestinal tract:",
            opts: ["CN V (Trigeminal)", "CN X (Vagus Nerve)", "CN VII (Facial)"],
            correct: 1
        },
        {
            x: 480, y: 380, size: 30, active: true,
            q: "A severe neurogenic shock patient exhibits hypotension and bradycardia. Which primary mechanism explains this?",
            opts: ["Loss of sympathetic vascular tone", "Severe systemic volume depletion", "Histamine-mediated vasodilation"],
            correct: 0
        },
        {
            x: 700, y: 220, size: 30, active: true,
            q: "Which specific brain area undergoes selective degeneration of dopaminergic neurons in Parkinson's Disease?",
            opts: ["Hippocampus CA1 region", "Substantia Nigra pars compacta", "Cerebellar Purkinje cells"],
            correct: 1
        }
    ];

    let currentAltar = null;

    // --- GAME LOOP ---
    function update() {
        if (isPaused) return;

        // 1. Player Movement Logic
        let dx = 0, dy = 0;
        if (keys['KeyW'] || keys['ArrowUp']) { dy -= 1; }
        if (keys['KeyS'] || keys['ArrowDown']) { dy += 1; }
        if (keys['KeyA'] || keys['ArrowLeft']) { dx -= 1; player.facing = 'left'; }
        if (keys['KeyD'] || keys['ArrowRight']) { dx += 1; player.facing = 'right'; }

        // Normalize speed
        if (dx !== 0 && dy !== 0) { dx *= 0.7071; dy *= 0.7071; }

        player.x = Math.max(20, Math.min(canvas.width - 20, player.x + dx * player.speed));
        player.y = Math.max(20, Math.min(canvas.height - 20, player.y + dy * player.speed));

        // 2. Attack Logic (Spacebar)
        if (keys['Space'] && attackCooldown <= 0) {
            attackActive = true;
            attackCooldown = 20; // frames
            
            // Damage nearby enemies
            enemies.forEach(e => {
                let dist = Math.hypot(e.x - player.x, e.y - player.y);
                if (dist < 55) {
                    e.hp -= 15;
                    // Knockback
                    e.x += (player.facing === 'right' ? 30 : -30);
                }
            });
        }

        if (attackCooldown > 0) attackCooldown--;
        if (attackCooldown < 12) attackActive = false;

        // 3. Enemy Movement & Collision
        enemies.forEach((e, idx) => {
            if (e.hp <= 0) return;

            e.x += e.vx;
            e.y += e.vy;

            // Bounce off walls
            if (e.x < 30 || e.x > canvas.width - 30) e.vx *= -1;
            if (e.y < 30 || e.y > canvas.height - 30) e.vy *= -1;

            // Hurt player on touch
            let dist = Math.hypot(e.x - player.x, e.y - player.y);
            if (dist < player.size + e.size) {
                player.hp = Math.max(0, player.hp - 0.4);
                document.getElementById('hp-bar').style.width = (player.hp / player.maxHp * 100) + '%';
            }
        });

        // 4. Check Altar Interactions
        altars.forEach(a => {
            if (!a.active) return;
            let dist = Math.hypot(a.x - player.x, a.y - player.y);
            if (dist < player.size + a.size) {
                openQuiz(a);
            }
        });
    }

    // --- RENDER ENGINE ---
    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw Floor Grid (Temple Tiles)
        ctx.strokeStyle = '#1e232d';
        ctx.lineWidth = 1;
        for (let x = 0; x < canvas.width; x += 40) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
        }
        for (let y = 0; y < canvas.height; y += 40) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
        }

        // Draw Glowing Altars
        altars.forEach(a => {
            if (!a.active) return;
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#d4af37';
            ctx.fillStyle = '#d4af37';
            ctx.beginPath();
            ctx.arc(a.x, a.y, a.size / 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0; // reset
        });

        // Draw Enemies (Shadow Beasts)
        enemies.forEach(e => {
            if (e.hp <= 0) return;
            ctx.fillStyle = e.color;
            ctx.beginPath();
            ctx.arc(e.x, e.y, e.size / 2, 0, Math.PI * 2);
            ctx.fill();

            // Enemy HP bar
            ctx.fillStyle = '#10141a';
            ctx.fillRect(e.x - 12, e.y - 20, 24, 4);
            ctx.fillStyle = '#22c55e';
            ctx.fillRect(e.x - 12, e.y - 20, (e.hp / e.maxHp) * 24, 4);
        });

        // Draw Attack Swing Slash
        if (attackActive) {
            ctx.strokeStyle = '#60a5fa';
            ctx.lineWidth = 4;
            ctx.beginPath();
            let startAngle = player.facing === 'right' ? -Math.PI / 4 : Math.PI * 3/4;
            let endAngle = player.facing === 'right' ? Math.PI / 4 : Math.PI * 5/4;
            ctx.arc(player.x, player.y, 40, startAngle, endAngle);
            ctx.stroke();
        }

        // Draw Player Sprite (Explorer Drake)
        ctx.fillStyle = '#3b82f6'; // Drake blue jacket
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.size / 2, 0, Math.PI * 2);
        ctx.fill();

        // Player Eyes/Direction indicator
        ctx.fillStyle = '#fff';
        let eyeOffset = player.facing === 'right' ? 5 : -5;
        ctx.beginPath();
        ctx.arc(player.x + eyeOffset, player.y - 3, 3, 0, Math.PI * 2);
        ctx.fill();
    }

    function mainLoop() {
        update();
        draw();
        requestAnimationFrame(mainLoop);
    }

    // --- QUIZ & PUZZLE INTERACTION ---
    function openQuiz(altar) {
        isPaused = true;
        currentAltar = altar;

        document.getElementById('quiz-modal').style.display = 'flex';
        document.getElementById('quiz-question').innerText = altar.q;

        const optionsBox = document.getElementById('quiz-options');
        optionsBox.innerHTML = '';

        altar.opts.forEach((optText, i) => {
            const btn = document.createElement('button');
            btn.className = 'quiz-btn';
            btn.innerText = (i + 1) + '. ' + optText;
            btn.onclick = () => submitAnswer(i);
            optionsBox.appendChild(btn);
        });
    }

    function submitAnswer(chosenIdx) {
        if (chosenIdx === currentAltar.correct) {
            currentAltar.active = false;
            relicsFound++;
            document.getElementById('relic-count').innerText = relicsFound + '/3';
            alert("Riddle Solved! Ancient relic unlocked!");
        } else {
            player.hp = Math.max(0, player.hp - 30);
            document.getElementById('hp-bar').style.width = (player.hp / player.maxHp * 100) + '%';
            alert("Incorrect! Ancient curse inflicts 30 damage!");
        }

        document.getElementById('quiz-modal').style.display = 'none';
        isPaused = false;
    }

    // Start Engine
    mainLoop();
</script>

</body>
</html>

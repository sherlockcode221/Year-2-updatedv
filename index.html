var audioCtx = null;
function playSFX(type) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    var now = audioCtx.currentTime;

    if (type === 'ok') {
      osc.type = 'sine'; osc.frequency.setValueAtTime(587.33, now); osc.frequency.exponentialRampToValueAtTime(880, now + 0.15);
      gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
      osc.start(now); osc.stop(now + 0.15);
    } else if (type === 'bad') {
      osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now); osc.frequency.linearRampToValueAtTime(80, now + 0.25);
      gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
      osc.start(now); osc.stop(now + 0.25);
      if(navigator.vibrate) navigator.vibrate(80);
    } else if (type === 'coin') {
      osc.type = 'triangle'; osc.frequency.setValueAtTime(987.77, now); osc.frequency.setValueAtTime(1318.51, now + 0.08);
      gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
      osc.start(now); osc.stop(now + 0.25);
    } else if (type === 'tick') {
      osc.type = 'square'; osc.frequency.setValueAtTime(800, now);
      gain.gain.setValueAtTime(0.05, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
      osc.start(now); osc.stop(now + 0.04);
    }
  } catch(e) {}
}

function checkDailyStreak() {
  var today = new Date().toDateString();
  if (lastLoginDate !== today) {
    var yesterday = new Date(Date.now() - 86400000).toDateString();
    if (lastLoginDate === yesterday) { loginStreak++; }
    else if (lastLoginDate !== "") { loginStreak = 1; }
    lastLoginDate = today;
    saveState();
    return true;
  }
  return false;
}

function submitScoreToGlobal(finalScore){
  if(finalScore <= 0) return;
  var entry = { id: playerId, name: playerName, avatar: currentAvatar, best: finalScore, t: Date.now() };
  db.ref("leaderboard/" + playerId).set(entry, function(err) {
    if(err) {
      var idx = leaderboardData.findIndex(p => p.id === playerId);
      if(idx >= 0) { if(finalScore > leaderboardData[idx].best) leaderboardData[idx] = entry; }
      else { leaderboardData.push(entry); }
      leaderboardData.sort((a,b) => b.best - a.best);
      drawLB();
    }
  });
}

function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

function stopT(){clearInterval(tmr);tmr=null}
function startT(sec,end){
  stopT();tt=sec;tl=sec;
  tmr=setInterval(function(){
    tl-=.1;
    var b=document.getElementById("tb"),c=document.getElementById("tc");
    if(b){b.style.width=Math.max(0,tl/tt*100)+"%";b.style.background=tl/tt<.3?"var(--cor)":"var(--mint)"}
    if(c)c.textContent="⏱ "+Math.max(0,Math.ceil(tl))+"s";
    if(tl<=3 && tl>0 && Math.abs(Math.round(tl)-tl)<0.05) playSFX('tick');
    if(tl<=0){stopT();end()}
  },100)
}

  document.getElementById("st").textContent="🔥 "+streak;
  document.getElementById("cc").innerHTML='<img class="avatar-img" src="'+AVATARS[currentAvatar]+'"> 🪙 '+coins;
}

function powerBar(){
  return '<div class="pwr-bar">'+
    '<button class="pwr-btn" onclick="usePwr(\'heart\')" '+(items.heart<=0||hearts>=3?'disabled':'')+'>❤️ +1 ('+items.heart+')</button>'+
    '<button class="pwr-btn" onclick="usePwr(\'freeze\')" '+(items.freeze<=0?'disabled':'')+'>⏱️ +5s ('+items.freeze+')</button>'+
    '<button class="pwr-btn" onclick="usePwr(\'double\')" '+(items.double<=0||doubleCoinActive?'disabled':'')+'>🪙 2x ('+(doubleCoinActive?'ON':items.double)+')</button>'+
  '</div>';
}

function usePwr(type){
  if(type==='heart' && items.heart>0 && hearts<3){ items.heart--; hearts++; }
  else if(type==='freeze' && items.freeze>0){ items.freeze--; tl+=5; tt+=5; }
  else if(type==='double' && items.double>0 && !doubleCoinActive){ items.double--; doubleCoinActive=true; }
  saveState();hudUp();
  var el = document.getElementById("pwr-container");
  if(el) el.innerHTML = powerBar();
}

function drawLB(){
  var el=document.getElementById("lb");if(!el)return;
  var h='<p><b>Name:</b> <img class="avatar-img" src="'+AVATARS[currentAvatar]+'"> '+esc(playerName)+' <button class="btn" style="padding:2px 8px;font-size:.8rem" onclick="changeName()">Edit</button></p>';
  h+='<p><b>Your Best: '+pb+' pts | 🪙 Balance: '+coins+' | 🔥 Streak: '+loginStreak+'d</b></p>';
  h+='<h2>🏆 Global Leaderboard ('+leaderboardData.length+')</h2>';
  if(!leaderboardData.length) h+='<p>No high scores recorded yet!</p>';
  else{
    h+='<ol>';
    leaderboardData.forEach(function(r,i){
      var medal = ["🥇","🥈","🥉"][i] || (i+1)+".";
      var isMe = r.id === playerId;
      var av = r.avatar && AVATARS[r.avatar] ? AVATARS[r.avatar] : AVATARS.brain;
      h+='<li class="'+(isMe?"me":"")+'"><span>'+medal+' <img class="avatar-img" src="'+av+'"> '+esc(r.name)+(isMe?' (You)':'')+'</span><span>'+r.best+' pts</span></li>';
    });
    h+='</ol>';
  }
  el.innerHTML=h;
}

function changeName(){
  var newName = prompt("Enter your doctor/student name:", playerName);
  if(newName && newName.trim()){
    playerName = newName.trim().substring(0, 18);
    saveState();
    if(pb > 0) submitScoreToGlobal(pb);
    drawLB();
  }
}

function title(){
 stopT();hud.hidden=true;OP.hidden=true;MODE="solo";doubleCoinActive=false;
 g.className="card hero";
 
 var showRewardModal = checkDailyStreak();
 var streakBonusHtml = showRewardModal ? '<div style="background:var(--card);padding:10px;border-radius:12px;margin-bottom:10px;border:2px solid var(--line)">🎁 <b>Daily Study Reward!</b> Day '+loginStreak+' streak! Claimed +'+(loginStreak*20)+' 🪙</div>' : '';
 if(showRewardModal) addCoins(loginStreak * 20);

 g.innerHTML=streakBonusHtml+'<h1>Neuroanatomy Challenge 🧠</h1><p>Master White Matter, Internal Capsule & Basal Nuclei (Prof. Autifi Lecture)!</p>'+
 '<div class="mode-toggle">'+
 '<button class="mode-btn '+(QUESTION_FORMAT==='mcq'?'active':'')+'" id="mMCQ">Multiple Choice</button>'+
 '<button class="mode-btn '+(QUESTION_FORMAT==='sa'?'active':'')+'" id="mSA">Short Answer</button>'+
 '</div>'+
 '<div class="row">'+
 '<button class="btn" id="go">Play Challenge</button>'+
 '<button class="btn" id="surv" style="background:var(--cor);color:#fff;">⚡ Sudden Death</button>'+
 '<button class="btn" id="shp" style="background:var(--mint)">🛍️ Shop</button>'+
 '</div><div class="lb" id="lb"></div>';

 document.getElementById("mMCQ").onclick=function(){QUESTION_FORMAT="mcq";title()};
 document.getElementById("mSA").onclick=function(){QUESTION_FORMAT="sa";title()};
 document.getElementById("go").onclick=function(){MODE="solo";hearts=3;score=0;streak=0;si=0;missedQuestions=[];intro()};
 document.getElementById("surv").onclick=startSurvivalMode;
 document.getElementById("shp").onclick=openShop;
 drawLB();
}

function startSurvivalMode(){
  MODE = "survival"; hearts = 1; score = 0; streak = 0; si = 0; missedQuestions = [];
  g.className = "card";
  var timeAllowed = QUESTION_FORMAT === "sa" ? 12 : 5;
  g.innerHTML = '<h2>⚡ Sudden Death Survival</h2><p>One heart. '+timeAllowed+' seconds per question. Maximum speed!</p><button class="btn" id="go">Begin Sudden Death</button>';
  document.getElementById("go").onclick = function(){
    var allQ = [];
    S.forEach(s => s.q.forEach(q => allQ.push(q)));
    S[0].o = shuf(allQ);
    qi = 0;
    showQ();
  };
}

function openShop(){
  stopT();hud.hidden=true;OP.hidden=true;
  g.className="card";
  
  var getThemeBtn = function(tName, cost) {
    if(currentTheme === tName) return '<button class="btn" style="background:var(--mint)" disabled>Equipped ✓</button>';
    if(unlockedThemes.includes(tName)) return '<button class="btn" onclick="applyTheme(\''+tName+'\'); openShop();">Equip</button>';
    return '<button class="btn" onclick="buyTheme(\''+tName+'\', '+cost+')">'+cost+' 🪙</button>';
  };

  g.innerHTML='<h2>🛍️ Game Shop</h2><p>Balance: <b>🪙 '+coins+' coins</b></p>'+
  '<h3>Power-ups</h3>'+
  '<div class="shop-item"><div><b>❤️ Extra Heart</b><br><small>Restores 1 heart mid-game</small></div><button class="btn" onclick="buyItem(\'heart\', 50)">50 🪙</button></div>'+
  '<div class="shop-item"><div><b>⏱️ Freeze Time</b><br><small>Adds +5 seconds to timer</small></div><button class="btn" onclick="buyItem(\'freeze\', 30)">30 🪙</button></div>'+
  '<div class="shop-item"><div><b>🪙 Double Coins</b><br><small>2x coin earnings for 1 stage</small></div><button class="btn" onclick="buyItem(\'double\', 40)">40 🪙</button></div>'+
  '<h3>Avatars 🖼️</h3>'+
  '<div class="shop-item"><div><img class="avatar-img" src="'+AVATARS.brain+'"> <b>Brain</b></div>'+(unlockedAvatars.includes('brain') ? '<button class="btn" onclick="setAvatar(\'brain\')">Equip</button>' : '<button class="btn" onclick="buyAvatar(\'brain\', 50)">50 🪙</button>')+'</div>'+
  '<div class="shop-item"><div><img class="avatar-img" src="'+AVATARS.dna+'"> <b>DNA Helix</b></div>'+(unlockedAvatars.includes('dna') ? '<button class="btn" onclick="setAvatar(\'dna\')">Equip</button>' : '<button class="btn" onclick="buyAvatar(\'dna\', 100)">100 🪙</button>')+'</div>'+
  '<div class="shop-item"><div><img class="avatar-img" src="'+AVATARS.stethoscope+'"> <b>Stethoscope</b></div>'+(unlockedAvatars.includes('stethoscope') ? '<button class="btn" onclick="setAvatar(\'stethoscope\')">Equip</button>' : '<button class="btn" onclick="buyAvatar(\'stethoscope\', 150)">150 🪙</button>')+'</div>'+
  '<div class="shop-item"><div><img class="avatar-img" src="'+AVATARS.microscope+'"> <b>Microscope</b></div>'+(unlockedAvatars.includes('microscope') ? '<button class="btn" onclick="setAvatar(\'microscope\')">Equip</button>' : '<button class="btn" onclick="buyAvatar(\'microscope\', 200)">200 🪙</button>')+'</div>'+
  '<h3>Themes 🎨</h3>'+
  '<div class="shop-item"><div><b>Warm Parchment (Light)</b></div>'+getThemeBtn('light', 0)+'</div>'+
  '<div class="shop-item"><div><b>Midnight Medical (Dark)</b></div>'+getThemeBtn('dark', 100)+'</div>'+
  '<div class="shop-item"><div><b>Nordic Slate (Cool)</b></div>'+getThemeBtn('nordic', 100)+'</div>'+
  '<div class="fb" id="sfb"></div>'+
  '<button class="opt" id="bk">Back to Menu</button>';
  document.getElementById("bk").onclick=title;
}

function buyItem(type, cost){
  var sfb=document.getElementById("sfb");
  if(coins >= cost){ coins -= cost; items[type]=(items[type]||0)+1; saveState(); sfb.textContent="✅ Purchased successfully!"; openShop(); }
  else { sfb.textContent="❌ Not enough coins!"; }
}

function buyTheme(t, cost){
  if(coins >= cost){ coins -= cost; unlockedThemes.push(t); applyTheme(t); openShop(); }
}

function buyAvatar(a, cost){
  if(coins >= cost){ coins -= cost; unlockedAvatars.push(a); setAvatar(a); openShop(); }
}

function setAvatar(a){
  currentAvatar = a; saveState();
  if(pb > 0) submitScoreToGlobal(pb); openShop();
}

function intro(){
 hudUp();var s=S[si];g.className="card";
 doubleCoinActive=false;
 if(si === 4) bossHP = 100;
 var timeAllowed = MODE==="survival" ? (QUESTION_FORMAT==="sa"?12:5) : (QUESTION_FORMAT==="sa"?s.secSA:s.secMCQ);
 g.innerHTML='<h2>'+s.n+'</h2><p>'+s.d+'</p><p>Format: <b>'+(QUESTION_FORMAT==='sa'?'Short Answer Typing':'Multiple Choice')+'</b></p><p><b>⏱️ '+timeAllowed+' seconds per question.</b></p><button class="btn" id="go">Start Stage</button>';
 document.getElementById("go").onclick=function(){qi=0;s.o=shuf(s.q.slice());showQ()};
}

function ok(){
  playSFX('ok'); streak++;
  var p=10+Math.min(streak,5)*2+Math.round(Math.max(tl,0)/tt*8);
  score+=p; addCoins(5); return p;
}

function bad(){
  playSFX('bad'); triggerShake();
  streak=0;hearts--;hudUp();
  if(hearts<=0){setTimeout(over,1200);return true}
  return false;
}
function bar(n,t){return '<div class="bar"><i style="width:'+(n/t*100)+'%"></i></div>'}

function checkShortAnswer(userStr, targetStr){
  var u = userStr.trim().toLowerCase().replace(/[^a-z0-9 ]/g, "");
  var t = targetStr.trim().toLowerCase().replace(/[^a-z0-9 ]/g, "");
  if(u === t) return true;
  if(t.length > 5 && u.length > 4 && (t.includes(u) || u.includes(t))) return true;
  return false;
}

function showQ(){
 var s=S[si],q=s.o[qi];locked=false;hudUp();
 var bossHtml = (si === 4 && MODE!=="survival") ? '<div class="boss-box"><b>👾 Dr. Inhibitor (Clinical Cases)</b><div class="boss-hp"><i style="width:'+bossHP+'%"></i></div></div>' : '';
 var timeAllowed = MODE==="survival" ? (QUESTION_FORMAT==="sa"?12:5) : (QUESTION_FORMAT==="sa"?s.secSA:s.secMCQ);
 
 var h=bossHtml+bar(qi,s.o.length)+'<div id="pwr-container">'+powerBar()+'</div>'+tbar()+'<div class="q">'+q[0]+'</div>';

 if(QUESTION_FORMAT === "sa"){
   h += '<input type="text" id="ansInput" placeholder="Type answer here..." autocomplete="off">'+
        '<button class="btn" id="subBtn" style="width:100%;margin-top:6px;">Submit Answer</button>';
   g.innerHTML=h+'<div class="fb" aria-live="polite"></div>';
   var inp = document.getElementById("ansInput");
   inp.focus();
   inp.onkeyup = function(e){ if(e.key === "Enter") processSA(); };
   document.getElementById("subBtn").onclick = processSA;
   startT(timeAllowed, function(){ processSA(true); });
 } else {
   var arr = [0,1,2]; shuf(arr);
   arr.forEach(function(k){h+='<button class="opt" data-k="'+k+'">'+q[1][k]+'</button>'});
   g.innerHTML=h+'<div class="fb" aria-live="polite"></div>';
   g.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){pickMCQ(+b.dataset.k,b)}});
   startT(timeAllowed, function(){ pickMCQ(-1); });
 }
}

function pickMCQ(k,b){
 if(locked)return;locked=true;stopT();var s=S[si],q=s.o[qi],fb=g.querySelector(".fb"),dead=false;
 g.querySelectorAll(".opt").forEach(function(x){if(+x.dataset.k===q[2])x.classList.add("ok")});
 if(k===q[2]){
   var p=ok();
   if(si === 4 && MODE!=="survival") { bossHP = Math.max(0, bossHP - 25); playSFX('strike'); }
   fb.textContent="✅ Correct! +"+p+" pts (+"+(doubleCoinActive?10:5)+" 🪙). "+q[4];
 }
 else{
   if(b)b.classList.add("no");
   fb.textContent=(k<0?"⏰ Time's up! ":"❌ Incorrect! ") + q[4];
   missedQuestions.push({ question: q[0], correctAnswer: q[1][q[2]], explanation: q[4] });
   dead=bad();
 }
 hudUp();if(dead)return;
 setTimeout(function(){qi++;if(qi>=s.o.length)stageDone();else showQ()},1800);
}

function processSA(isTimeout){
 if(locked)return;locked=true;stopT();var s=S[si],q=s.o[qi],fb=g.querySelector(".fb"),dead=false;
 var userAns = isTimeout ? "" : document.getElementById("ansInput").value;
 var isCorrect = !isTimeout && checkShortAnswer(userAns, q[3]);

 if(isCorrect){
   var p=ok();
   if(si === 4 && MODE!=="survival") { bossHP = Math.max(0, bossHP - 25); playSFX('strike'); }
   fb.textContent="✅ Correct! +"+p+" pts (+"+(doubleCoinActive?10:5)+" 🪙). "+q[4];
 }
 else{
   fb.textContent=(isTimeout ? "⏰ Time's up! " : "❌ Incorrect! ") + "Correct answer: " + q[3] + ". " + q[4];
   missedQuestions.push({ question: q[0], correctAnswer: q[3], explanation: q[4] });
   dead=bad();
 }
 hudUp();if(dead)return;
 setTimeout(function(){qi++;if(qi>=s.o.length)stageDone();else showQ()},2200);
}

function stageDone(){
 stopT();si++;addCoins(25);saveState();
 if(si>=S.length || MODE==="survival")return win();
 g.innerHTML='<h2>Stage Clear! 🧠</h2><p>Score: '+score+'. Hearts remaining: '+hearts+'.</p><p>Stage Bonus: <b>+'+(doubleCoinActive?50:25)+' Coins 🪙</b></p><button class="btn" id="go">Next Stage</button>';
 document.getElementById("go").onclick=intro;
}

function win(){
 var bonus=hearts*20;score+=bonus;addCoins(50);
 var isNewBest = score > pb;
 if(isNewBest){ pb = score; saveState(); }
 submitScoreToGlobal(score);
 hudUp();
 g.innerHTML='<p class="big">'+score+'</p><h2>Master of Neuroanatomy 🏆</h2><p>Run Complete! Bonus +'+bonus+' pts & +50 🪙.'+(isNewBest?' <b>New High Score! 🎉</b>':'')+'</p><div class="row"><button class="btn" id="go">Play Again</button><button class="btn" id="rev" style="background:var(--sky)">📝 Review Mistakes ('+missedQuestions.length+')</button></div><div class="lb" id="lb"></div>';
 document.getElementById("go").onclick=title;
 document.getElementById("rev").onclick=drawMistakesReview;
 drawLB();
}

function over(){
 stopT();
 var isNewBest = score > pb;
 if(isNewBest){ pb = score; saveState(); }
 submitScoreToGlobal(score);
 g.innerHTML='<h2>Exam Failed 💔</h2><p>Review Prof. Autifi\'s lecture slides and try again! Score: '+score+(isNewBest?'. <b>New High Score!</b>':'.')+'</p><div class="row"><button class="btn" id="go">Try Again</button><button class="btn" id="rev" style="background:var(--sky)">📝 Review Mistakes ('+missedQuestions.length+')</button></div><div class="lb" id="lb"></div>';
 document.getElementById("go").onclick=title;
 document.getElementById("rev").onclick=drawMistakesReview;
 drawLB();
}

function drawMistakesReview(){
  stopT();
  hud.hidden = true;
  OP.hidden = true;
  g.className = "card";
  
  if(missedQuestions.length === 0){
    g.innerHTML = '<h2>Flawless Performance! 🎉</h2><p>You answered every single question correctly this run!</p><button class="btn" id="mmenu">Main Menu</button>';
    document.getElementById("mmenu").onclick = title;
    return;
  }
  
  var h = '<h2>📝 Mistakes Review (' + missedQuestions.length + ')</h2><div style="max-height:320px; overflow-y:auto; margin:12px 0;">';
  missedQuestions.forEach(function(item, idx){
    h += '<div class="review-item">' +
      '<b>Q' + (idx + 1) + ': ' + esc(item.question) + '</b><br>' +
      '<span style="color:var(--mint)">✅ <b>Correct Answer:</b> ' + esc(item.correctAnswer) + '</span><br>' +
      '<small>💡 <i>' + esc(item.explanation) + '</i></small>' +
    '</div>';
  });
  h += '</div><button class="btn" id="mmenu">Main Menu</button>';
  g.innerHTML = h;
  
  document.getElementById("mmenu").onclick = title;
}

title();
</script>
</body>
</html>
